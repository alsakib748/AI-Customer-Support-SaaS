<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/SupportAI-brand-assets/favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/SupportAI-brand-assets/png/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/SupportAI-brand-assets/png/favicon-16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/SupportAI-brand-assets/png/apple-touch-icon-180.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#2563EB" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SupportAI</title>
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
        <style>
            .layout-sidebar {
                position: fixed;
                width: 20rem;
                height: calc(100vh - 8rem);
                z-index: 999;
                overflow-y: auto;
                user-select: none;
                top: 6rem;
                left: 2rem;
                transition:
                    transform var(--layout-section-transition-duration),
                    left var(--layout-section-transition-duration);
                background-color: var(--surface-overlay);
                border-radius: var(--content-border-radius);
                padding: 0.5rem 1.5rem;
                scrollbar-width: none; /* Firefox */
                -ms-overflow-style: none; /* IE 10+ */
            }

            .layout-sidebar::-webkit-scrollbar {
                display: none; /* Chrome, Safari, Edge */
            }
        </style>
    </head>

    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
