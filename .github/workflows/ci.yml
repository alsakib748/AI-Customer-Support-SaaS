name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.3, SQLite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, zip, pdo_sqlite, sqlite3, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan jwt:secret --force --ansi

      - name: Run test suite
        run: php vendor/bin/phpunit --colors=always

      - name: Determine changed PHP files
        id: changed
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --depth=1 origin "${{ github.base_ref }}" || true
          else
            BASE="HEAD~1"
          fi
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.php' | grep -v 'bootstrap/cache/services.php' || true)
          else
            FILES=""
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Pint (changed files only)
        if: steps.changed.outputs.files != ''
        working-directory: .
        run: php backend/vendor/bin/pint --test ${{ steps.changed.outputs.files }}

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine changed frontend files
        id: changed
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --depth=1 origin "${{ github.base_ref }}" || true
          else
            BASE="HEAD~1"
          fi
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- frontend \
              | grep -E '\.(js|jsx|cjs|mjs|vue)$' \
              | grep -v '^frontend/package-lock.json$' \
              | sed 's#^frontend/##' || true)
          else
            FILES=""
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Lint changed files
        if: steps.changed.outputs.files != ''
        working-directory: frontend
        run: npx eslint ${{ steps.changed.outputs.files }}

      - name: Build
        run: npm run build

  # PostgreSQL-gated behaviour (locking, vector search, ILIKE, analytics
  # aggregation SQL) cannot be validated on SQLite. Enable this job by setting
  # the repository variable ENABLE_POSTGRES_CI=true; tagged tests are skipped
  # locally unless a PG connection is configured.
  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_POSTGRES_CI == 'true' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, zip, pdo_pgsql, pgsql, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan jwt:secret --force --ansi

      - name: Detect PostgreSQL-tagged tests
        id: detect
        run: |
          COUNT=$(grep -rl "@group postgres" tests | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Run PostgreSQL-tagged tests
        if: steps.detect.outputs.count != '0'
        run: php vendor/bin/phpunit --group postgres --colors=always
